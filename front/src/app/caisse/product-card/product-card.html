<!-- [class.sold-out] ajoute la classe CSS "sold-out" seulement si soldOut() est vrai.
     [disabled] désactive le bouton si soldOut() est vrai (empêche le clic). -->
<button type="button" class="card product-card" [class.sold-out]="soldOut()" [disabled]="soldOut()" (click)="onClick()">
  <span>{{ icon() }}</span>
  <span>{{ product().name }}</span>
  <span>{{ product().price | euros }}</span>

  @if (soldOut()) {
    <span class="badge badge-danger">Hors stock</span>
  } @else {
    <span class="badge">Stock : {{ available() }}</span>
  }
</button>
