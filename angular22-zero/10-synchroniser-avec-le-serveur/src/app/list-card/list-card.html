<!--
  Gabarit d'UNE liste. list() lit l'entrée du composant (c'est un signal).
  Pour agir, on « émet » une sortie avec emit(), et c'est le parent (App) qui réagit.
-->
<section class="card">
  <div class="card-header">
    <!--
      Le nom est barré quand la liste est terminée : même classe « done » que pour une tâche,
      mais la condition est le signal calculé completed() (voir list-card.ts).
    -->
    <h2 [class.done]="completed()">{{ list().name }}</h2>
    <!-- Le compteur « réalisées / total ». Il est masqué quand la liste est vide. -->
    @if (list().tasks.length > 0) {
      <span class="count">{{ doneCount() }} / {{ list().tasks.length }}</span>
    }
    <button
      type="button"
      class="delete"
      title="Supprimer la liste"
      aria-label="Supprimer la liste"
      (click)="deleteList.emit()"
    >
      ✕
    </button>
  </div>

  <ul>
    @for (task of list().tasks; track task.id) {
      <li>
        <label [class.done]="task.done">
          <!--
            Au clic, $event.preventDefault() empêche le navigateur de cocher la case lui-même :
            seul [checked]="task.done" la change. Depuis l'étape 10, les listes sont modifiées
            dans le navigateur avant l'envoi au serveur : la case change donc aussitôt.
            Puis emit(task) envoie la tâche au parent, qui la reçoit dans $event.
          -->
          <input
            type="checkbox"
            [checked]="task.done"
            (click)="$event.preventDefault(); toggleTask.emit(task)"
          />
          {{ task.title }}
        </label>
        <button
          type="button"
          class="delete"
          title="Supprimer la tâche"
          aria-label="Supprimer la tâche"
          (click)="deleteTask.emit(task)"
        >
          ✕
        </button>
      </li>
    } @empty {
      <li class="empty">Aucune tâche pour l'instant.</li>
    }
  </ul>

  <!-- Formulaire d'ajout d'une tâche : même principe que celui de création d'une liste. -->
  <form class="new-task" (ngSubmit)="submitTask()">
    <input
      type="text"
      class="field"
      name="title"
      placeholder="Nouvelle tâche"
      aria-label="Nouvelle tâche"
      maxlength="200"
      [(ngModel)]="newTaskTitle"
    />
    <button type="submit" class="button" [disabled]="!newTaskTitle().trim()">Ajouter</button>
  </form>
</section>
